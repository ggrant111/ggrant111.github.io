<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>ggrant111</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f3f4f6;
        margin: 0;
        padding: 24px;
      }

      h1 {
        text-align: center;
        margin-bottom: 24px;
      }

      .app-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin: 24px auto;
        max-width: 900px;
      }

      .app-card {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 220px;
        padding: 18px 20px;
        border-radius: 12px;
        background: linear-gradient(135deg, #1f2937, #374151);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .app-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
      }

      .app-card.primary {
        background: linear-gradient(135deg, #0f766e, #14b8a6);
      }

      .app-card.secondary {
        background: linear-gradient(135deg, #7c3aed, #a78bfa);
      }

      .app-card.glowdeck {
        background: linear-gradient(135deg, #0f172a, #2563eb);
      }

      footer {
        text-align: center;
        margin-top: 30px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="pp"><a href="Punnypop/index.html"></a></div>
    <h1>Choose an App</h1>

    <div class="app-grid">
      <a class="app-card primary" href="Punnypop/index.html">PunnyPop</a>
      <a class="app-card secondary" href="insult/index.html">Insult</a>
      <a class="app-card glowdeck" href="glowdeck/index.html">GlowDeck</a>
      <a
        class="app-card"
        href="https://github.com/ggrant111/glowdeck-gameday/releases/tag/v2026.11.08-beta.1"
        target="_blank"
        rel="noopener noreferrer"
        >GlowDeck GameDay Release</a
      >
      <a
        class="app-card"
        href="https://ggrant111.github.io/glowdeck-gameday/"
        target="_blank"
        rel="noopener noreferrer"
        >GlowDeck ESP Web Installer</a
      >
    </div>
  </body>
  <footer>PunnyPop &copy; 2023</footer>
</html>
